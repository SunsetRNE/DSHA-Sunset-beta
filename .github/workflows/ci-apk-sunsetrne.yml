# SunsetRNE 实验测试包：固定测试签名、完整离线+应急资产、可核对的 CI 回执。
#
# 设计边界：
#   * 只产出 debug（可调试）实验包，applicationId 固定 com.dsh.clienu.SunsetRNE；
#     不碰正式 E7E3 证书、不碰 release.yml / ci-package.yml 的正式发布路径。
#   * 离线输入包由 tools/ci-assets.py 生成，HTTPS + 固定 SHA-256 传递；
#     仓库内不保存任何密钥或用户数据。
#   * 测试签名固定：DSHA_TEST_KEYSTORE_BASE64 解码到 DSHA_TEST_KEYSTORE 指定的一次性
#     绝对路径（$RUNNER_TEMP 下），证书 SHA-256 由 input test_certificate_sha256 或
#     ci/experimental-test-identity.json 显式给出（固定 DB1FB87A…CF35），绝不以
#     「DN 含 Android Debug」代替固定摘要。解码、核对、两个 flavor 的 Gradle 构建与
#     清理在同一个 step 内完成；构建期用 --init-script 把 android.signingConfigs.debug
#     明确指向该路径，不依赖 java user.home / HOME，也不复制 Gradle 用户缓存。
#   * 普通 push 的编译与单测由 ci-fast（Source checks）负责；本工作流只由
#     workflow_dispatch 触发，并在构建前等待同一 commit 的 Source checks 通过
#     （GH Actions API + actions:read，既不猜也不跳过）。
#   * 发布只在 publish=true 时发生：必须显式给出 release_tag，目标固定为本次
#     GITHUB_SHA；同一 tag 指向别的提交就失败，不覆盖未知发布。
name: SunsetRNE experimental test package

on:
  workflow_dispatch:
    inputs:
      asset_bundle_url:
        description: tools/ci-assets.py 生成的不可变 HTTPS 离线输入包
        required: true
        type: string
      asset_bundle_sha256:
        description: 该输入包的固定 SHA-256（64 位小写十六进制）
        required: true
        type: string
      test_certificate_sha256:
        description: 实验测试证书 SHA-256；留空则用 ci/experimental-test-identity.json
        required: false
        default: ''
        type: string
      release_tag:
        description: 发布到该 tag（例如 v0.2.0-rc2-sunsetrne.1）；publish=true 时必须填写
        required: false
        default: ''
        type: string
      publish:
        description: 勾选后把两个 APK 作为 prerelease 发布到 release_tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # 读取同一 commit 的 Source checks 运行状态；publish job 单独提权写 Release。
  actions: read

concurrency:
  group: sunsetrne-package-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.dsh.clienu.SunsetRNE
  APK_FLAVOR_STANDARD: standard
  APK_FLAVOR_LOW: low

jobs:
  source-checks:
    name: Require passing Source checks on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Wait for the same-SHA Source checks run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = "https://api.github.com/repos/%s/actions/workflows/ci-fast.yml/runs?head_sha=%s&per_page=50" % (repo, sha)


          def same_sha_runs():
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return [row for row in json.load(response).get("workflow_runs", [])
                          if row.get("head_sha") == sha]


          deadline = time.monotonic() + 40 * 60
          first_seen = time.monotonic() + 5 * 60
          while True:
              runs = same_sha_runs()
              if runs:
                  pushes = [row for row in runs if row.get("event") == "push"] or runs
                  pushes.sort(key=lambda row: (row.get("run_number") or 0, row.get("id") or 0))
                  latest = pushes[-1]
                  if latest.get("status") == "completed":
                      conclusion = latest.get("conclusion")
                      if conclusion != "success":
                          raise SystemExit("Source checks（run %s）未通过：%s" % (latest.get("id"), conclusion))
                      print(json.dumps({"status": "PASS_SOURCE_CHECKS", "sha": sha,
                                        "run": latest.get("id"), "conclusion": conclusion}, ensure_ascii=False))
                      break
              elif time.monotonic() >= first_seen:
                  raise SystemExit("5 分钟内没有找到 SHA %s 的 Source checks 运行" % sha)
              if time.monotonic() >= deadline:
                  raise SystemExit("等待 SHA %s 的 Source checks 超过 40 分钟" % sha)
              time.sleep(15)
          PY

  build:
    name: Build experimental debug pair
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # GitHub 草稿 Release 仅向具 push 权限的身份提供下载；构建时读取本仓库输入草稿。
    permissions:
      contents: write
      actions: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Toolchain identity from source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Resolve the expected experimental test certificate
        id: identity
        env:
          INPUT_CERT: ${{ inputs.test_certificate_sha256 }}
        run: |
          set -euo pipefail
          cert="$INPUT_CERT"
          if [ -z "$cert" ]; then
            cert=$(python3 -c 'import json;print(json.load(open("ci/experimental-test-identity.json"))["certificateSha256"])')
          fi
          case "$cert" in
            *[!0-9a-f]* | '' ) echo "test_certificate_sha256 必须是 64 位小写十六进制" >&2; exit 1 ;;
          esac
          if [ "${#cert}" -ne 64 ]; then
            echo "test_certificate_sha256 长度不是 64" >&2; exit 1
          fi
          publish=$(python3 -c 'import json;print(json.load(open("ci/release-identity.json"))["certificateSha256"])')
          if [ "$cert" = "$publish" ]; then
            echo "实验测试包不接受正式 E7E3 证书摘要" >&2; exit 1
          fi
          echo "certificate=$cert" >> "$GITHUB_OUTPUT"

      - name: Restore exact offline inputs from the selected SHA
        env:
          INPUT_URL: ${{ inputs.asset_bundle_url }}
          INPUT_SHA: ${{ inputs.asset_bundle_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$INPUT_URL"
          test -n "$INPUT_SHA"
          # 只有同仓库的固定 asset ID 才使用令牌；外部 HTTPS 地址不带凭据。
          asset_prefix="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"
          asset_id="${INPUT_URL#"$asset_prefix"}"
          if [[ "$INPUT_URL" == "$asset_prefix"* && "$asset_id" =~ ^[0-9]+$ ]]; then
            gh api "$INPUT_URL" --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/ci-inputs.zip"
            python3 tools/ci-assets.py --file "$RUNNER_TEMP/ci-inputs.zip" --sha256 "$INPUT_SHA"
          else
            python3 tools/ci-assets.py --url "$INPUT_URL" --sha256 "$INPUT_SHA"
          fi
          test -s app/src/main/assets/offline-rootfs.bin
          test -s app/src/main/assets/dsh-runtime.bin
          echo "bundle_sha256=$INPUT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Complete asset deployment contract on the restored inputs
        # ci-fast 的 fast 阶段只跑 --fixtures-only 合成契约；完整成员集核对需要已还原的
        # 离线生成物（ubuntu-tools.bin 等），这里按 runtime 阶段原样执行，不 -x 跳过、
        # 不降级、不删资产。
        run: python3 tools/run-host-tests.py --stage runtime --only test-asset-deployment.py

      - name: Android SDK and NDK from the toolchain lock
        run: |
          set -euo pipefail
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          # 解析入口与其余工作流共用：runner 不保证 cmdline-tools 的 bin 在 PATH 上。
          source tools/ci-android-sdk.sh "platforms;$platform" "build-tools;$buildtools" "ndk;$ndk"
          echo "$ANDROID_HOME/build-tools/$buildtools" >> "$GITHUB_PATH"

      - name: Set the experimental application ID in the CI checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          original = 'applicationId "com.dsh.client"'
          if text.count(original) != 1:
              raise SystemExit('EXPERIMENTAL_APPLICATION_ID_SOURCE')
          path.write_text(text.replace(original, 'applicationId "com.dsh.clienu.SunsetRNE"'))
          PY

      - name: Build both flavors with the fixed test key, then erase it
        env:
          KEY_BASE64: ${{ secrets.DSHA_TEST_KEYSTORE_BASE64 }}
          EXPECTED_CERT: ${{ steps.identity.outputs.certificate }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP 未设置}"
          if [ -z "${KEY_BASE64:-}" ]; then
            echo "缺少 Actions Secret DSHA_TEST_KEYSTORE_BASE64（只有实验测试 key，不是正式发布 key）" >&2
            exit 1
          fi
          umask 077
          # 固定一次性绝对路径：Gradle 通过 DSHA_TEST_KEYSTORE 读到同一份文件。
          signing_root=$(realpath "$RUNNER_TEMP")
          keystore="$signing_root/dsha-sunsetrne-test.keystore"
          init_script="$signing_root/dsha-sunsetrne-signing.init.gradle"
          export DSHA_TEST_KEYSTORE="$keystore"
          # 只删本次显式解析出的两个临时文件；先核验绝对路径前缀，绝不对计算目录 rm -rf。
          cleanup() {
            status=$?
            for target in "$keystore" "$init_script"; do
              resolved=$(realpath -m -- "$target")
              case "$resolved" in
                "$signing_root"/dsha-sunsetrne-test.keystore|"$signing_root"/dsha-sunsetrne-signing.init.gradle) ;;
                *) echo "拒绝清理非本次临时文件" >&2; exit 1 ;;
              esac
              rm -f -- "$resolved"
            done
            exit "$status"
          }
          trap cleanup EXIT
          # 密钥只经管道写入固定路径，不出现在命令行参数或日志里，也不回显。
          printf '%s' "$KEY_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          fingerprint=$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$fingerprint" != "$EXPECTED_CERT" ]; then
            echo "解码出的测试 keystore 证书摘要与本次期望不一致，停止产出" >&2
            exit 1
          fi
          keystore_sha=$(sha256sum "$keystore" | cut -d' ' -f1)
          # 最小受信 Groovy：只把 debug 签名指向本次固定路径与既有测试口令，
          # 不改 app/build.gradle，也不全量复制 Gradle 缓存或改写 HOME。
          cat > "$init_script" <<'GROOVY'
          gradle.beforeProject { project ->
              project.plugins.withId('com.android.application') {
                  def signing = project.extensions.getByName('android').signingConfigs.debug
                  signing.storeFile = new File(System.getenv('DSHA_TEST_KEYSTORE'))
                  signing.storePassword = 'android'
                  signing.keyAlias = 'androiddebugkey'
                  signing.keyPassword = 'android'
                  signing.enableV1Signing = true
                  signing.enableV2Signing = true
                  signing.enableV3Signing = true
              }
          }
          GROOVY
          chmod +x gradlew
          ./gradlew --init-script "$init_script" :app:testStandardDebugUnitTest :app:assembleStandardDebug \
            --no-daemon --max-workers=1 --stacktrace
          test -f app/build/outputs/apk/standard/debug/app-standard-debug.apk
          ./gradlew --init-script "$init_script" :app:testLowDebugUnitTest :app:assembleLowDebug \
            --no-daemon --max-workers=1 --stacktrace
          test -f app/build/outputs/apk/low/debug/app-low-debug.apk
          if [ "$(sha256sum "$keystore" | cut -d' ' -f1)" != "$keystore_sha" ]; then
            echo "Gradle 运行期间测试 keystore 被改写，停止产出" >&2
            exit 1
          fi

      - name: Verify both APKs against the selected certificate and assets
        id: verify
        env:
          EXPECTED_CERT: ${{ steps.identity.outputs.certificate }}
          BUNDLE_URL: ${{ inputs.asset_bundle_url }}
          BUNDLE_SHA: ${{ inputs.asset_bundle_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/ci-test-package.py \
            --standard app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            --low app/build/outputs/apk/low/debug/app-low-debug.apk \
            --certificate-sha256 "$EXPECTED_CERT" \
            --bundle-url "$BUNDLE_URL" --bundle-sha256 "$BUNDLE_SHA" \
            --expected-commit "$GITHUB_SHA" \
            --out dist/experimental-package-receipt.json
          for flavor in standard low; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            out="dist/SunsetRNE-$flavor-experimental.apk"
            cp "$apk" "$out"
            sha256sum "$out" > "$out.sha256"
          done
          sha256sum dist/SunsetRNE-*-experimental.apk >> "$GITHUB_STEP_SUMMARY"
          cat dist/experimental-package-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Name the artifact after the verified identity
        id: name
        run: |
          set -euo pipefail
          echo "artifact=SunsetRNE-experimental" >> "$GITHUB_OUTPUT"

      # 2026-02-26 起支持 archive:false；每次只能上传一个文件，名称使用真实文件名。
      - name: Upload Standard APK directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SunsetRNE-standard-experimental.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Low APK directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SunsetRNE-low-experimental.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload package receipt and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            dist/SunsetRNE-*-experimental.apk.sha256
            dist/experimental-package-receipt.json
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: experimental-test-reports
          path: |
            app/build/host-tests
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish prerelease for the verified bytes
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Bind the release tag to the triggering commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            '' ) echo "publish=true 时必须显式给出 release_tag" >&2; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            v* ) ;;
            * ) echo "release_tag 必须以 v 开头" >&2; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            *[!0-9A-Za-z._-]* ) echo "release_tag 只允许字母数字和 . _ -" >&2; exit 1 ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: SunsetRNE-*
          merge-multiple: true
          path: ${{ runner.temp }}/verified

      - name: Refuse to overwrite a different publication on the same tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2> "$RUNNER_TEMP/tag-error.txt"); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "tag/同名引用指向其它提交，拒绝覆盖" >&2; exit 1
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error.txt"; then
            echo "查询发布引用失败" >&2
            cat "$RUNNER_TEMP/tag-error.txt" >&2
            exit 1
          fi

      - name: Verify the downloaded receipt before publishing
        env:
          VERIFIED: ${{ runner.temp }}/verified
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/verify-experimental-receipt.py --artifacts "$VERIFIED" --commit "$EXPECTED_COMMIT"

      - name: Create the prerelease bound to the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/verified"
          mkdir -p "$work/release"
          cp "$work"/SunsetRNE-*-experimental.apk "$work"/SunsetRNE-*-experimental.apk.sha256 \
            "$work"/experimental-package-receipt.json "$work/release/"
          {
            printf 'SunsetRNE 实验测试包（debug，包名 %s）。\n' "com.dsh.clienu.SunsetRNE"
            printf '\n提交：%s\n' "$GITHUB_SHA"
            printf 'CI run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\n这是实验测试签名，不是正式 E7E3 发布；不用于覆盖安装正式包。\n'
          } > "$work/release/README-experimental.txt"
          gh release create "$RELEASE_TAG" "$work/release"/* --prerelease --target "$GITHUB_SHA" \
            --title "SunsetRNE experimental $(date -u +%Y%m%d)" --notes-file "$work/release/README-experimental.txt"
