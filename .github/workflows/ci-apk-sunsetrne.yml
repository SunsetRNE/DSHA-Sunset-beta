# SunsetRNE 标准 CI 打包：为 com.dsh.clienu.SunsetRNE 产出测试签名 debug APK。
# 不建 tag、不触发 Release、不使用仓库签名密钥；签名由 AGP debug keystore 自动生成（测试签名）。
# upload-artifact v7 起支持 archive: false 直传单文件，产物保留 .apk 后缀（v7.0.0 见 2026-02-26 release）。
name: SunsetRNE APK (test signing)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ci-apk-sunsetrne.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ci-apk-sunsetrne.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunsetrne-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.dsh.clienu.SunsetRNE
  APK_PREFIX: SunsetRNE

jobs:
  apk:
    name: Build test-signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Toolchain identity from source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Point applicationId at the CI package name
        run: |
          set -euo pipefail
          sed -i "s|applicationId \"com.dsh.client\"|applicationId \"$APP_ID\"|" app/build.gradle
          grep -q "applicationId \"$APP_ID\"" app/build.gradle
          grep -n 'applicationId' app/build.gradle

      - name: Android SDK
        run: |
          set -euo pipefail
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          sdkmanager "platforms;$platform" "build-tools;$buildtools"
          echo "$ANDROID_HOME/build-tools/$buildtools" >> "$GITHUB_PATH"

      - name: Assemble debug APK (offline bundles excluded, see ci-package.yml for full packages)
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --max-workers=2 \
            -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets

      - name: Stage APK under a stable artifact name
        id: stage
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          mkdir -p dist
          out="dist/$APK_PREFIX-${GITHUB_SHA::12}.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          sha256sum "$out" | tee "$out.sha256"
          cat "$out.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify package name and test signature
        run: |
          set -euo pipefail
          apk='${{ steps.stage.outputs.apk }}'
          pkg=$(aapt2 dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "package=$pkg"
          test "$pkg" = "$APP_ID"
          apksigner verify --print-certs "$apk" | grep -i 'certificate DN' | head -2
          apksigner verify --print-certs "$apk" | grep -qi 'Android Debug'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.stage.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: 14
