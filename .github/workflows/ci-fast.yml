name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      # 快速用例会用 javac 编译真实源码（Shizuku 用户服务事务、LanProxyService、WebPageScripts 等），
      # 并以 android.jar 作为编译期依赖，Gradle 单测也要同一个平台；固定 SDK 必须在这些步骤之前装好。
      - name: Pinned Android SDK platform and build tools
        run: |
          set -euo pipefail
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          sdkmanager "platforms;$platform" "build-tools;$buildtools"
      - name: Verify checked-in contracts
        run: |
          python3 tools/prepare-runtime-tools.py --check
          python3 tools/verify-runtime-descriptor-source.py
          python3 tools/generate-third-party-notices.py --check
          python3 tools/check-third-party-notices.py
          python3 tools/generate-builtin-plugins.py --verify
          python3 tools/generate-credential-paths.py --check
          python3 tools/prepare-semver-reference.py
          python3 tools/format-java-tree.py --check
          python3 tools/run-host-tests.py --check-manifest
          python3 tools/check-source-hygiene.py
          python3 tools/check-ui-i18n.py
      - name: Fixed dsh-web-mobile upstream bytes for server patch evidence
        # 测试自身不联网：先按内置插件 dshaUpstream 的固定提交取回三个服务端模块，
        # 每份字节核对 tools/apply-mobile-client-patches.mjs 的锁定摘要；缺字节时 host-tests 直接失败，不再静默跳过。
        run: node tools/prepare-ci-mobile-upstream.mjs --output app/build/mobile-upstream-a094/lib
      - name: Archive-free APK asset deployment contracts
        # 完整资产成员集核对需要还原后的离线生成物（ubuntu-tools.bin 等），该行登记在 runtime 阶段；
        # 这里只跑不依赖归档的合成 fixture 契约，完整模式不删除、不降级、不跳过。
        run: python3 -B tools/test-asset-deployment.py --fixtures-only
      - name: Isolated source and protocol regressions
        # 干净 runner 没有 Gradle 缓存：Shizuku 库 AAR 的 javap 佐证会如实打印 SKIP，而 AIDL/桩/协议
        # 与真实 ShellService 事务的源码校验照常执行；缺的离线大资产留给 ci-package，不在这里补造。
        # 需要 Gradle JAR 缓存的 root-support 行是 support 阶段，其余依赖缓存的行是 runtime 阶段，
        # 都不在本阶段选择范围，因此 host fast 保持在 Gradle 之前，不重排到 full unit 之后。
        run: python3 tools/run-host-tests.py --stage fast --jdk "$JAVA_HOME"
      - name: Android Java and both flavor unit tests without offline package generation
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets --no-daemon --max-workers=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-regressions
          path: |
            app/build/host-tests
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
